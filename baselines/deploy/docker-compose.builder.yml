# Neo4j LLM Graph Builder backend (pinned clone) + a dedicated Neo4j 5.x with APOC.
# Started by scripts/baseline_neo4j_builder.sh; all variables below are exported by that script.
# Secrets come from git-ignored env files under data/baselines/secrets/.
name: litkg-baselines
services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    env_file: ${KGB_SECRETS}/neo4j.env                  # NEO4J_AUTH=neo4j/<generated>
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      # Keep only the latest transaction log file: the graph is rebuilt from checkpoints, not restored.
      NEO4J_db_tx__log_rotation_retention__policy: "1 files"
    ports:
      - "127.0.0.1:${KGB_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - kgb_neo4j_data:/data
  builder-backend:
    build:
      context: ${KGB_BUILDER_DIR}/backend
      # Generated by scripts/baseline_neo4j_builder.sh from the pinned upstream Dockerfile:
      # only the model/NLTK download steps are adapted (proxy, HF mirror or pre-downloaded model).
      dockerfile: Dockerfile.kgb
      args:
        HTTP_PROXY: ${KGB_BUILD_PROXY:-}
        HTTPS_PROXY: ${KGB_BUILD_PROXY:-}
        http_proxy: ${KGB_BUILD_PROXY:-}
        https_proxy: ${KGB_BUILD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
        no_proxy: localhost,127.0.0.1
        HF_ENDPOINT: ${KGB_HF_ENDPOINT:-https://huggingface.co}
    restart: unless-stopped
    env_file: ${KGB_SECRETS}/builder-backend.env        # LLM_MODEL_CONFIG_LITKG_COMPAT=model,url,key
    environment:
      NEO4J_URI: bolt://neo4j:7687
      IS_EMBEDDING: "True"
      EMBEDDING_PROVIDER: sentence-transformer
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      GCS_FILE_CACHE: "False"
    # Fewer workers than upstream (8x8) to keep memory bounded on a shared host.
    command: ["gunicorn", "score:app", "--workers", "2", "--threads", "4", "--worker-class",
              "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--timeout", "1800"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${KGB_BUILDER_PORT:-18000}:8000"
    depends_on: [neo4j]
volumes:
  kgb_neo4j_data:
